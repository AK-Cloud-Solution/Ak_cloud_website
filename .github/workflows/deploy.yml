name: Build and deploy AK Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  TF_IN_AUTOMATION: true
  TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_mongo_uri: ${{ secrets.MONGO_URI }}
  TF_VAR_admin_key: ${{ secrets.ADMIN_KEY }}
  TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
  TF_VAR_email_user: ${{ secrets.EMAIL_USER }}
  TF_VAR_email_pass: ${{ secrets.EMAIL_PASS }}
  TF_VAR_name_prefix: akcloud
  IMAGE_TAG: ${{ github.sha }}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Bootstrap Azure resources
        run: terraform -chdir=infra init -input=false && terraform -chdir=infra apply -auto-approve -input=false -var='image_tag=bootstrap'

      - name: Sign in to ACR
        id: registry
        shell: bash
        run: |
          ACR_NAME=$(terraform -chdir=infra output -raw acr_name)
          az acr login --name "$ACR_NAME"
          echo "login_server=$(terraform -chdir=infra output -raw acr_login_server)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: image
        run: |
          BACKEND_URL=$(terraform -chdir=infra output -raw backend_url)
          docker build -f Dockerfile.backend -t "${{ steps.registry.outputs.login_server }}/akcloud-backend:${IMAGE_TAG}" .
          docker tag "${{ steps.registry.outputs.login_server }}/akcloud-backend:${IMAGE_TAG}" "${{ steps.registry.outputs.login_server }}/akcloud-backend:latest"
          docker push "${{ steps.registry.outputs.login_server }}/akcloud-backend:${IMAGE_TAG}"
          docker push "${{ steps.registry.outputs.login_server }}/akcloud-backend:latest"
          docker build -f Dockerfile.frontend --build-arg VITE_API_URL="${BACKEND_URL}/api" -t "${{ steps.registry.outputs.login_server }}/akcloud-frontend:${IMAGE_TAG}" .
          docker tag "${{ steps.registry.outputs.login_server }}/akcloud-frontend:${IMAGE_TAG}" "${{ steps.registry.outputs.login_server }}/akcloud-frontend:latest"
          docker push "${{ steps.registry.outputs.login_server }}/akcloud-frontend:${IMAGE_TAG}"
          docker push "${{ steps.registry.outputs.login_server }}/akcloud-frontend:latest"

      - name: Deploy image
        run: terraform -chdir=infra apply -auto-approve -input=false -var="image_tag=${IMAGE_TAG}"

      - name: Print application URLs
        run: |
          echo "Frontend: $(terraform -chdir=infra output -raw frontend_url)"
          echo "Backend: $(terraform -chdir=infra output -raw backend_url)"
